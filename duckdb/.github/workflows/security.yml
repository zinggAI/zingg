name: dependency-security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  package-security-sbom:
    name: Assemble release SBOM for scanning
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native Linux package and SBOM
        shell: bash
        run: CREATE_JRE=true ./packaging/package-native.sh dist
      - name: Upload package SBOM
        uses: actions/upload-artifact@v4
        with:
          name: zingg-duckdb-security-sbom
          path: dist/zingg-duckdb-0.1.0/sbom.spdx.json
          if-no-files-found: error

  osv-full-scan:
    name: Scan packaged SBOM for vulnerabilities (OSV)
    needs: package-security-sbom
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      download-artifact: zingg-duckdb-security-sbom
      scan-args: |-
        -L ./sbom.spdx.json
      fail-on-vuln: true
      # The action still archives its SARIF report, but avoids requiring code-scanning
      # upload permission for forked pull requests.
      upload-sarif: false
